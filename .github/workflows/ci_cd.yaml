name: CI-CD - API Gestionnaire de Taches

# Déclenche le pipeline lors d'un push ou d'une Pull Request sur main
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Autorise le pipeline à lire le dépôt
permissions:
  contents: read

jobs:
  tests:
    name: Qualite du code et tests Django
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code du dépôt GitHub
      - name: Recuperer le code
        uses: actions/checkout@v4

      # 2. Installer Python
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # 3. Installer les dépendances du projet
      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      # 4. Vérifier la qualité du code
      - name: Verifier le code avec Ruff
        run: ruff check .


      # 5. Exécuter les tests Django avec SQLite
      - name: Executer les tests Django
        env:
          SECRET_KEY: "cle-secrete-reservee-aux-tests"
          POSTGRES_DB: "test_db"
          POSTGRES_USER: "test_user"
          POSTGRES_PASSWORD: "test_password"
          DB_ENGINE: "django.db.backends.sqlite3"
          DB_NAME: ":memory:"
        run: python manage.py test
